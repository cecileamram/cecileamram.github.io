      <line x1="0" y1="48" x2="225" y2="48" stroke="#8c9298" stroke-width="1"/>
      <text x="112" y="76" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#4a5056" text-anchor="middle">Senior Living</text>
    </g>
