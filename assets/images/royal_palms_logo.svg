<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <rect width="400" height="180" fill="#ffffff" rx="12" stroke="#e2d8c3" stroke-width="2"/>
  <g transform="translate(30, 30)">
    <!-- Palm Icon Circle -->
    <g transform="translate(10, 15)">
      <circle cx="45" cy="45" r="42" fill="none" stroke="#4a5056" stroke-width="4"/>
      <!-- Stylized Palm Fronds -->
      <path d="M45,80 Q45,30 20,20 Q45,45 45,80 Z" fill="#4a5056"/>
      <path d="M45,80 Q45,25 35,10 Q50,40 45,80 Z" fill="#4a5056"/>
